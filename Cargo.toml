# The open engine. The desktop app is a separate workspace under
# crates/rewind-app, so its dependencies and license stay out of this one.
# The guest's init is a workspace of its own too, so the guest is rebuilt
# only when the init changes, not with every change to the engine.
[workspace]
resolver = "3"
members = [
    "crates/rewind",
    "crates/rewind-core",
    "crates/rewind-store",
    "crates/rewind-trace",
    "crates/rewind-vmm",
]
exclude = ["crates/rewind-app", "crates/rewind-init"]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/fzakaria/rewindvm"

[profile.release]
opt-level = 3
lto = "thin"
debug = "line-tables-only"

# exportReferencesGraph needs nix-derivation's
# structured_attrs_files_with_reference_graphs, merged in
# https://github.com/cachix/nix-derivation/pull/6 but not released yet.
[patch.crates-io]
nix-derivation = { git = "https://github.com/cachix/nix-derivation", rev = "e02e776cce1dc1e6d432b8cb3460026e7c76def4" }
