# The open engine. The desktop app is a separate workspace under
# crates/rewind-app, so its dependencies and license stay out of this one.
# The guest's init is a workspace of its own too, so the guest is rebuilt
# only when the init changes, not with every change to the engine.
[workspace]
resolver = "3"
members = [
    "crates/rewind",
    "crates/rewind-core",
    "crates/rewind-mapped",
    "crates/rewind-store",
    "crates/rewind-trace",
    "crates/rewind-vmm",
]
exclude = ["crates/rewind-app", "crates/rewind-init"]

[workspace.package]
version = "0.14.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fzakaria/rewindvm"

# Every crate of the workspace takes these through `[lints] workspace =
# true`. The package build runs clippy and fails on any warning
# (nix/rewind.nix); a local `cargo build` only warns.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# An item marked pub that nothing outside its crate can reach. rustc
# treats every pub item as used, so pub(crate) is what lets dead_code
# report one that nothing calls.
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Tests may unwrap (clippy.toml); everywhere else a failure is either
# returned or, where it cannot happen, an expect that says why.
unwrap_used = "deny"
# Every unsafe block says, in a SAFETY comment, why its contract holds.
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "thin"
debug = "line-tables-only"

# exportReferencesGraph needs nix-derivation's
# structured_attrs_files_with_reference_graphs, merged in
# https://github.com/cachix/nix-derivation/pull/6 but not released yet.
[patch.crates-io]
nix-derivation = { git = "https://github.com/cachix/nix-derivation", rev = "e02e776cce1dc1e6d432b8cb3460026e7c76def4" }
