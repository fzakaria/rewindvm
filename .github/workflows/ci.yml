# On every change: formatting first, then `nix flake check`, which runs the
# checks in nix/checks.nix:
#
#   checks.prose: no em dashes and none of the banned vocabulary, in docs,
#     site copy and code comments alike (tools/check-prose.py)
#   checks.determinism: a run with background jobs, the kernel's RNG and a
#     sleep replays exactly from boot and from a keyframe, and another seed
#     makes another run. It boots the guest, so it needs /dev/kvm, which
#     GitHub's Linux runners have but do not open to the build user.
#
# Then the packages build: the command, the desktop app, the release
# tarball and the site.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Open /dev/kvm to the build user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = kvm nixos-test benchmark big-parallel

      - name: Formatting
        run: nix fmt -- --ci

      - name: Tests
        run: nix flake check -L

      - name: Packages
        run: nix build -L .#rewind .#app .#release .#site
