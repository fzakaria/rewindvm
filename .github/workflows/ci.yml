# Disabled: nixbot (nixbot.decio.us) builds pull requests and main, and
# its effect pushes main's packages to rewindvm.cachix.org and pins them
# (nix/effects.nix). This workflow runs only when started by hand, as a
# fallback for when nixbot is down.
#
# A run: `nix flake check`, which runs the checks in nix/checks.nix and
# flake.nix:
#
#   checks.prose: no em dashes and none of the banned vocabulary, in docs,
#     site copy and code comments alike (tools/check-prose.py)
#   checks.determinism: a run with background jobs, the kernel's RNG and a
#     sleep replays exactly from boot and from a keyframe, and another seed
#     makes another run. It boots the guest, so it needs /dev/kvm, which
#     GitHub's Linux runners have but do not open to the build user.
#   checks.formatting: `nix fmt` would change no file
#   checks.package-*: every package builds: the command, the desktop app,
#     the three release assets, the site and the debuginfod server `rewind
#     gdb` fetches. The command's and the app's builds run clippy as they
#     compile and fail on any warning (nix/crane.nix).
#
# Everything built is pushed to rewindvm.cachix.org, and on main the
# packages are pinned there. To turn the workflow back on, restore the
# push trigger below.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # A runner starts with about 14 GB free, and the guest kernel's build
      # tree, the app and the static toolchain together need more. The
      # preinstalled SDKs this workflow never uses are most of the disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Open /dev/kvm to the build user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = kvm nixos-test benchmark big-parallel

      # Pulls what earlier runs built and pushes what this one builds, so
      # the guest kernel and the app compile once per change, and users of
      # the flake download them (flake.nix's nixConfig). The Rust
      # dependencies are derivations of their own (nix/crane.nix), so they
      # compile once per Cargo.lock and come from here otherwise.
      - uses: cachix/cachix-action@v16
        with:
          name: rewindvm
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Tests
        run: nix flake check -L

      # The latest builds of main, pinned so they stay when the cache fills
      # and the dependency builds go: the last five of each, the kernel's
      # debug output among them, for `rewind gdb` on runs made with them.
      # Releases pin theirs for good (release.yml). The debuginfod server
      # is nixpkgs' own, which cache.nixos.org keeps, and Cachix pins only
      # what its own cache holds, so it is not pinned here. cachix-action
      # pushes what the job builds in the background and waits for the
      # pushes only when the job ends, and a pin needs its whole closure
      # in the cache, so each package is pushed before its pin.
      - name: Pin main's packages
        if: github.ref == 'refs/heads/main'
        run: |
          for attr in rewind app kernel kernel-debug; do
            path=$(nix build --no-link --print-out-paths ".#$attr")
            cachix push rewindvm "$path"
            cachix pin rewindvm "main-$attr" "$path" --keep-revisions 5
          done
