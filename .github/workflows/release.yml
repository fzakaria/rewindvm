# Publishes a GitHub release for a version tag such as v0.1.0, with the
# assets the site and the tutorials link under releases/latest/download:
#
#   rewind-x86_64-linux.tar.gz        the command, for people without Nix
#   rewind-debug-x86_64-linux.tar.gz  the kernel's DWARF and sources, for
#                                     the command's `rewind gdb`
#   rewind-app-x86_64-linux.tar.gz    the desktop app, for any distribution
#
# The tag must match VERSION. Nix users need
# none of this: `nix run github:fzakaria/rewindvm/v0.1.0` builds the same
# tag, from rewindvm.cachix.org when CI has built it.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # A runner starts with about 14 GB free, and a cold build of the
      # guest kernel, the app and the static toolchain needs more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v16
        with:
          name: rewindvm
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check the tag against VERSION
        run: |
          version=$(cat VERSION)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION, $version" >&2
            exit 1
          fi

      # The tutorials show run ids, which hash the guest's initramfs and
      # kernel; a tag whose guest is not the one they were recorded with
      # would publish pages whose commands make other runs.
      - name: Check the tutorials were recorded with this guest
        run: |
          want=$(grep -v '^#' docs/templates/recorded-with)
          have=$(printf 'initrd %s\nkernel %s\n' \
            "$(nix build --no-link --print-out-paths .#initrd)" \
            "$(nix build --no-link --print-out-paths .#kernel)")
          if [ "$want" != "$have" ]; then
            echo "the tutorials were recorded with another guest; run tools/record-tutorials.py" >&2
            diff <(echo "$want") <(echo "$have") >&2
            exit 1
          fi

      - name: Build the assets
        run: |
          nix build -L .#release -o cli
          nix build -L .#release-debug -o debug
          nix build -L .#app-release -o app

      # Cachix evicts the paths used least when the cache is full, and
      # never a pinned one. A release's packages are what its `nix run` and
      # its runs' `rewind gdb` fetch, the kernel's debug output among them,
      # which nothing depends on, so it needs a pin of its own; they are
      # kept for good. The Rust dependency builds are not pinned: evicted,
      # they compile again once.
      - name: Pin the release in the cache
        run: |
          for attr in rewind app kernel kernel-debug; do
            cachix pin rewindvm "$attr-$GITHUB_REF_NAME" \
              "$(nix build --no-link --print-out-paths ".#$attr")" --keep-forever
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            cli/rewind-x86_64-linux.tar.gz debug/rewind-debug-x86_64-linux.tar.gz \
            app/rewind-app-x86_64-linux.tar.gz
