[package]
name = "rewind-trace"
description = "Reading and querying the event traces of Rewind VM runs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The marks the guest's init writes into every trace.
rewind-init = { path = "../rewind-init" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
