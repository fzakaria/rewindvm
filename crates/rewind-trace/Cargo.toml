[package]
name = "rewind-trace"
description = "Reading and querying the event traces of Rewind VM runs"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# The marks the guest's init writes into every trace.
rewind-init = { path = "../rewind-init", default-features = false }
serde = { version = "1", features = ["derive"] }
# Manifests, read by their version first.
serde_json = "1"
# .rwd exports: a tar archive, which rewind import and the app both walk here.
tar = "0.4"
thiserror = "2"
