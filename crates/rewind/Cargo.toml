[package]
name = "rewind"
description = "Run, scrub, rewind and fork deterministic Linux VMs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rewind"
path = "src/main.rs"

[dependencies]
rewind-core = { path = "../rewind-core" }
rewind-init = { path = "../rewind-init" }
rewind-trace = { path = "../rewind-trace" }
rewind-vmm = { path = "../rewind-vmm" }
anyhow = "1"
# Derive-based argument parsing, as in omnibin.
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
blake3 = "1"
