[package]
name = "rewind-qemu"
description = "Replaying Rewind VM runs on the QEMU machine, without KVM"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "rewind-qemu"
path = "src/main.rs"

[dependencies]
rewind-core = { path = "../rewind-core" }
rewind-init = { path = "../rewind-init", default-features = false }
rewind-trace = { path = "../rewind-trace" }
rewind-vmm = { path = "../rewind-vmm" }
anyhow = "1"
blake3 = "1"
# The browser bundle's keyframes and image, which the page unpacks with
# the browser's own gzip.
flate2 = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
