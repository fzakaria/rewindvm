# The Rewind desktop app: the scrubber over a recorded run.
#
# A workspace of its own, so its dependencies and its license stay out of the
# engine's workspace at the repository root, which excludes this directory.
[package]
name = "rewind-app"
description = "The Rewind VM desktop app: scrub, compare and fork recorded runs"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace]

[dependencies]
# The terminal pane's emulator and pty, as Zed uses with GPUI.
alacritty_terminal = "0.26"
anyhow = "1"
base64 = "0.22"
# License keys are Ed25519 signatures, checked offline (see LICENSING.md).
ed25519-dalek = "2"
# Channels from the terminal's reader thread to the UI.
futures = "0.3"
# .rwd exports: a tar archive compressed with zstd, as the engine writes them.
tar = "0.4"
zstd = "0.13"
# GPUI, Zed's UI framework, as published from zed@1a28cff under the gpui-pre
# name. The crates.io `gpui` release is a year behind and renders through
# blade on Linux; gpui-pre renders through wgpu on Wayland and X11.
gpui = { package = "gpui-pre", version = "=0.3.7" }
log = "0.4"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["wayland", "x11"] }
rewind-trace = { path = "../rewind-trace" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# GPUI's X11 backend with one change: the window takes a 32-bit ARGB
# visual only when a compositing manager runs, so it is not left black on
# drivers that cannot present into one. See vendor/gpui-pre-linux/README.md.
[patch.crates-io]
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }

[profile.release]
opt-level = 3
lto = "thin"
debug = "line-tables-only"

# The license issuer: built only with --features issuer, so it never ships
# in the app's package. See LICENSING.md.
[features]
issuer = []

[[bin]]
name = "rewind-app"
path = "src/main.rs"

[[bin]]
name = "rewind-license"
path = "src/bin/rewind-license.rs"
required-features = ["issuer"]
