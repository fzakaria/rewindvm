[package]
name = "rewind-store"
description = "A content-addressed store for the pages of Rewind VM keyframes"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
blake3 = "1"
# Per-page compression; guest pages are mostly sparse.
zstd = "0.13"
# The sorted copy of the index, mapped into memory.
rewind-mapped = { path = "../rewind-mapped" }
