[package]
name = "rewind-core"
description = "Building inputs for, executing, and finding Rewind VM runs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rewind-init = { path = "../rewind-init" }
rewind-trace = { path = "../rewind-trace" }
rewind-store = { path = "../rewind-store" }
rewind-vmm = { path = "../rewind-vmm" }
# Keyframes on disk.
bincode = "1"
# .rwd exports: a zstd-compressed tar.
tar = "0.4"
zstd = "0.13"
# .rwd exports from https URLs. rustls with compiled-in root certificates,
# so the static release binary needs nothing from the host.
ureq = { version = "3", default-features = false, features = ["rustls"] }
anyhow = "1"
# Content hashes of images and run inputs.
blake3 = { version = "1", features = ["mmap"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# passAsFile names, which Nix derives from SHA-256.
sha2 = "0.10"
# .drv files as Nix writes them, and the .attrs.json and .attrs.sh a build
# with structured attributes reads.
nix-derivation = "0.6"
gdbstub = "0.7"
gdbstub_arch = "0.3"
