[package]
name = "rewind-init"
description = "The Rewind VM guest's init, and the job it runs"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Built on its own, static against musl, by nix/guest.nix.
[workspace]

[[bin]]
name = "rewind-init"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Output tree hashes, the same function the host uses.
blake3 = "1"
