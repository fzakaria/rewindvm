[package]
name = "rewind-init"
description = "The Rewind VM guest's init, and the job it runs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rewind-init"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Output tree hashes, the same function the host uses.
blake3 = "1"
